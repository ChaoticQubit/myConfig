model = "gpt-5.6-luna"
model_reasoning_effort = "max"
model_verbosity = "medium"
approvals_reviewer = "auto_review"
hide_agent_reasoning = true
show_raw_agent_reasoning = false

[features]
hooks = true

[tui]
status_line = ["model", "reasoning", "project-name", "git-branch", "branch-changes", "weekly-limit", "used-tokens", "context-used", "approval-mode"]
status_line_use_colors = true

[mcp_servers.linear]
url = "https://mcp.linear.app/mcp"

[marketplaces.deep-docs]
source_type = "local"
source = "/Users/chaoticqubit/.dotfiles/agents/marketplaces/deep-docs"

[marketplaces.software-practices]
source_type = "local"
source = "/Users/chaoticqubit/.dotfiles/agents/marketplaces/software-practices"

[plugins."deep-docs@deep-docs"]
enabled = true

[plugins."software-practices@software-practices"]
enabled = true
