[keys]
prefix = "ctrl+b"                          # prefix key

# --- Session -------------------------------------------------------------
help     = "prefix+?"                      # show bindings
settings = "prefix+s"                      # settings panel
detach   = "prefix+q"                      # detach session
reload_config = "prefix+shift+r"           # reload config
open_notification_target = "prefix+o"      # jump to notification

# --- Workspaces ----------------------------------------------------------
workspace_picker = "prefix+w"              # pick workspace
new_workspace    = "prefix+shift+n"        # new workspace
rename_workspace = "prefix+shift+w"        # rename workspace
close_workspace  = "prefix+shift+d"        # close workspace
goto             = "prefix+g"              # navigate mode
# previous_workspace = ""                  # prev workspace (unset)
# next_workspace     = ""                  # next workspace (unset)
# switch_workspace   = ""                  # workspace by number (unset)

# --- Worktrees -----------------------------------------------------------
new_worktree = "prefix+shift+g"            # new git worktree
# open_worktree   = ""                     # open worktree (unset)
# remove_worktree = ""                     # remove worktree (unset)

# --- Agents --------------------------------------------------------------
# previous_agent = ""                      # prev agent (unset)
# next_agent     = ""                      # next agent (unset)
# focus_agent    = ""                      # agent by number (unset)

# --- Tabs ----------------------------------------------------------------
new_tab      = "prefix+c"                  # new tab
rename_tab   = "prefix+shift+t"            # rename tab
previous_tab = "prefix+p"                  # prev tab
next_tab     = "prefix+n"                  # next tab
close_tab    = "prefix+ampersand"          # close tab (custom)
switch_tab   = "prefix+1..9"               # tab by number

# --- Panes: focus & layout -----------------------------------------------
focus_pane_left  = "prefix+h"              # focus left
focus_pane_down  = "prefix+j"              # focus down
focus_pane_up    = "prefix+k"              # focus up
focus_pane_right = "prefix+l"              # focus right
swap_pane_left   = "prefix+shift+h"        # move pane left
swap_pane_down   = "prefix+shift+j"        # move pane down
swap_pane_up     = "prefix+shift+k"        # move pane up
swap_pane_right  = "prefix+shift+l"        # move pane right
cycle_pane_next     = "prefix+tab"         # cycle panes
cycle_pane_previous = "prefix+shift+tab"   # cycle panes back
# last_pane = ""                           # back-and-forth (unset)
split_horizontal = "prefix+double_quote"   # split across (custom)
split_vertical   = "prefix+percent"        # split down (custom)
close_pane  = "prefix+x"                   # close pane
rename_pane = "prefix+shift+p"             # rename pane
zoom        = "prefix+z"                   # fullscreen pane
resize_mode = "prefix+r"                   # resize panes

# --- Pane content --------------------------------------------------------
# in copy mode: v/space select, y/enter copy, q/esc cancel (fixed)
copy_mode = "prefix+y"                     # copy / scrollback (custom)
edit_scrollback = "prefix+e"               # scrollback in editor

# --- UI ------------------------------------------------------------------
toggle_sidebar = "prefix+b"                # show/hide sidebar

# --- Remote --------------------------------------------------------------
remote_image_paste = "ctrl+v"              # paste image (--remote only)

# --- Navigate mode (local keys, no prefix) -------------------------------
navigate_workspace_up   = "up"             # workspace up
navigate_workspace_down = "down"           # workspace down
navigate_pane_left  = "h"                  # pane left
navigate_pane_down  = "j"                  # pane down
navigate_pane_up    = "k"                  # pane up
navigate_pane_right = "l"                  # pane right

# --- Legacy indexed (prefer switch_tab / switch_workspace / focus_agent) --
# [keys.indexed]
# tabs       = ""                          # e.g. "ctrl" -> ctrl+1..9 tabs
# workspaces = ""                          # e.g. "ctrl+shift" -> workspaces
# agents     = ""                          # e.g. "alt" -> agent rows

[ui]
agent_panel_sort = "spaces"                # group agents by space, not priority
